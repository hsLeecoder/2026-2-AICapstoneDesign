<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사내 규정 Q&A 챗봇</title>
  <style>
    :root {
      --navy: #1b2f55;
      --blue: #2f6fdc;
      --bg: #f4f6fa;
      --line: #dde3ee;
      --text: #1c2433;
      --muted: #6b778c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .demo {
      padding: 40px;
      color: var(--muted);
    }

    #launcher {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    }

    #panel {
      position: fixed;
      right: 24px;
      bottom: 92px;
      width: 360px;
      height: 520px;
      max-height: calc(100vh - 120px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .2);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #panel.open {
      display: flex;
    }

    .head {
      background: var(--navy);
      color: #fff;
      padding: 14px 16px;
      font-weight: bold;
    }

    .head small {
      display: block;
      font-weight: normal;
      opacity: .75;
      margin-top: 2px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }

    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }

    .msg.loading {
      color: var(--muted);
    }

    .msg.error {
      background: #fdecec;
      border-color: #f3c0c0;
      color: #9b2c2c;
    }

    .sources {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      font-size: 12px;
      color: var(--muted);
      white-space: normal;
    }

    .sources div {
      margin-top: 3px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--blue);
      color: var(--blue);
      background: #fff;
      border-radius: 14px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    #input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      font-family: inherit;
    }

    #send {
      border: 0;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      padding: 0 16px;
      cursor: pointer;
      font-family: inherit;
    }

    #send:disabled {
      opacity: .5;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="demo">사내 규정 Q&A 챗봇 데모 페이지입니다. 오른쪽 아래 버튼을 눌러 질문해 보세요.</div>

  <button id="launcher" aria-label="챗봇 열기">💬</button>
  <div id="panel">
    <div class="head">사내 규정 Q&A<small>취업규칙·복리후생 규정을 근거로 답하고 출처를 알려드립니다</small></div>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="궁금한 규정을 질문해 보세요" autocomplete="off">
      <button id="send" type="submit">전송</button>
    </form>
  </div>

  <script>
    (function () {
      var panel = document.getElementById('panel');
      var messages = document.getElementById('messages');
      var form = document.getElementById('form');
      var input = document.getElementById('input');
      var send = document.getElementById('send');
      var busy = false;

      function addMessage(text, cls) {
        var el = document.createElement('div');
        el.className = 'msg ' + cls;
        el.textContent = text;           // textContent 로 넣어 HTML 이 실행되지 않게 한다
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        return el;
      }

      function addSources(el, sources) {
        if (!sources || sources.length === 0) return;
        var box = document.createElement('div');
        box.className = 'sources';
        var title = document.createElement('div');
        title.textContent = '출처';
        box.appendChild(title);
        sources.forEach(function (s) {
          var line = document.createElement('div');
          line.textContent = s.article + ' · p.' + s.page + ' · ' + s.fileName;
          box.appendChild(line);
        });
        el.appendChild(box);
      }

      async function ask(question) {
        if (busy || !question.trim()) return;
        busy = true; send.disabled = true;
        addMessage(question, 'user');
        var loading = addMessage('답변을 찾는 중입니다…', 'bot loading');
        try {
          var res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question })
          });
          if (!res.ok) throw new Error(String(res.status));
          var data = await res.json();
          loading.className = 'msg bot';
          loading.textContent = data.answer;
          addSources(loading, data.sources);
        } catch (e) {
          loading.className = 'msg bot error';
          loading.textContent = '답변을 가져오지 못했습니다. 모델 서버 연결 상태를 확인한 뒤 다시 시도해 주세요.';
        } finally {
          busy = false; send.disabled = false; input.focus();
          messages.scrollTop = messages.scrollHeight;
        }
      }

      // 첫 안내 메시지와 예시 질문
      var hello = addMessage('안녕하세요! 규정에 대해 궁금한 점을 물어보세요.', 'bot');
      var chips = document.createElement('div');
      chips.className = 'chips';
      chips.style.marginTop = '8px';
      ['연차는 1년 일하면 며칠 받아요?', '병가는 최대 며칠이고 월급 나와요?', '징계에는 어떤 종류가 있어요?'].forEach(function (q) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = q;
        b.addEventListener('click', function () { ask(q); });
        chips.appendChild(b);
      });
      hello.appendChild(chips);

      document.getElementById('launcher').addEventListener('click', function () {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) input.focus();
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var q = input.value;
        input.value = '';
        ask(q);
      });
    })();
  </script>
</body>

</html>
