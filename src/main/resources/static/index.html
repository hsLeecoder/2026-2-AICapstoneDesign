<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 규정 Q&A 챗봇</title>
<style>
  :root { --navy:#1b2f55; --blue:#2f6fdc; --bg:#f4f6fa; --line:#dde3ee; --text:#1c2433; --muted:#6b778c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:var(--bg); color:var(--text); }
  .demo { padding:40px; color:var(--muted); }
  #launcher { position:fixed; right:24px; bottom:24px; width:56px; height:56px; border:0; border-radius:50%;
    background:var(--blue); color:#fff; font-size:26px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #panel { position:fixed; background:#fff; border:1px solid var(--line); display:none; flex-direction:column; overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.2); }
  #panel.open { display:flex; }
  #panel.mode-widget { right:24px; bottom:92px; width:360px; height:520px; max-height:calc(100vh - 120px); border-radius:14px; }
  #panel.mode-side { right:0; top:0; bottom:0; width:480px; max-width:100vw; border-radius:0; border:0; border-left:1px solid var(--line); }
  #panel.mode-full { inset:0; border-radius:0; border:0; }
  .head { background:var(--navy); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .head .title { flex:1; font-weight:bold; white-space:nowrap; min-width:0; }
  #panel.mode-widget .head .title small, #panel.mode-side .head .title small { display:none; }
  #panel.mode-widget .seg { order:3; width:100%; }
  #panel.mode-widget .seg button { flex:1; }
  .head .title small { white-space:normal; display:block; font-weight:normal; opacity:.75; margin-top:2px; font-size:12px; }
  .seg { display:flex; border:1px solid rgba(255,255,255,.4); border-radius:8px; overflow:hidden; }
  .seg button, .hbtn { background:transparent; color:#fff; border:0; padding:5px 9px; font-size:12px; cursor:pointer; font-family:inherit; }
  .seg button.on { background:rgba(255,255,255,.28); font-weight:bold; }
  .hbtn { border:1px solid rgba(255,255,255,.4); border-radius:8px; }
  #messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
  .inner { width:100%; max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; line-height:1.5; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.loading { color:var(--muted); }
  .msg.error { background:#fdecec; border-color:#f3c0c0; color:#9b2c2c; }
  .toggle { display:block; margin-top:10px; border:0; background:none; color:var(--blue); font-size:12px; cursor:pointer; padding:0; font-family:inherit; }
  .sources { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted); white-space:normal; }
  .src { margin-top:8px; }
  .src b { color:var(--text); }
  .src pre { margin:4px 0 0; padding:8px 10px; background:var(--bg); border-radius:8px; max-height:160px; overflow-y:auto;
    white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:12px; line-height:1.5; color:var(--text); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border:1px solid var(--blue); color:var(--blue); background:#fff; border-radius:14px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  form { padding:10px; border-top:1px solid var(--line); background:#fff; }
  form .inner { flex-direction:row; gap:8px; }
  #input { flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; }
  #send { border:0; border-radius:8px; background:var(--navy); color:#fff; padding:0 16px; cursor:pointer; font-family:inherit; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="demo">사내 규정 Q&A 챗봇 데모 페이지입니다. 오른쪽 아래 버튼을 눌러 질문해 보세요.</div>
<button id="launcher" aria-label="챗봇 열기">💬</button>
<div id="panel" class="mode-widget">
  <div class="head">
    <div class="title">사내 규정 Q&A<small>취업규칙·복리후생 규정을 근거로 답하고 출처를 알려드립니다</small></div>
    <div class="seg" id="modes">
      <button type="button" data-mode="widget" class="on">위젯</button>
      <button type="button" data-mode="side">사이드바</button>
      <button type="button" data-mode="full">전체</button>
    </div>
    <button type="button" class="hbtn" id="newchat">새 대화</button>
    <button type="button" class="hbtn" id="close" aria-label="닫기">✕</button>
  </div>
  <div id="messages"><div class="inner" id="list"></div></div>
  <form id="form"><div class="inner">
    <input id="input" type="text" placeholder="궁금한 규정을 질문해 보세요" autocomplete="off">
    <button id="send" type="submit">전송</button>
  </div></form>
</div>
<script>
(function () {
  var panel = document.getElementById('panel'), list = document.getElementById('list');
  var box = document.getElementById('messages'), input = document.getElementById('input'), send = document.getElementById('send');
  var DOC_LABELS = { 'workrules_goyongnodong.pdf': '취업규칙(고용노동부 표준)', 'welfare_ananti.pdf': '복리후생규정(아난티)',
                     'welfare_goyongnodong.pdf': '선진기업복지제도 안내(노동부·근로복지공단)' };
  var MAX_HISTORY = 3;
  var busy = false, history = [], conversationId = newId();

  function newId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'c-' + Date.now() + '-' + Math.random().toString(16).slice(2, 10);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // textContent 로 넣어 HTML 이 실행되지 않게 한다
    return e;
  }
  function addMessage(text, cls) {
    var m = el('div', 'msg ' + cls, text);
    list.appendChild(m);
    box.scrollTop = box.scrollHeight;
    return m;
  }

  // 출처 '보기/접기': 누르면 근거가 된 조항 원문까지 펼친다
  function addSources(msg, sources) {
    if (!sources || sources.length === 0) return;
    var toggle = el('button', 'toggle', '출처 보기 (' + sources.length + ') ▾');
    toggle.type = 'button';
    var wrap = el('div', 'sources');
    wrap.hidden = true;
    sources.forEach(function (s) {
      var item = el('div', 'src');
      var head = el('div');
      if (s.article) head.appendChild(el('b', '', s.article + ' · '));
      head.appendChild(el('span', '', 'p.' + s.page + ' · ' + (DOC_LABELS[s.fileName] || s.fileName)));
      item.appendChild(head);
      if (s.content) item.appendChild(el('pre', '', s.content));
      wrap.appendChild(item);
    });
    toggle.addEventListener('click', function () {
      wrap.hidden = !wrap.hidden;
      toggle.textContent = '출처 ' + (wrap.hidden ? '보기 (' + sources.length + ') ▾' : '접기 ▴');
      box.scrollTop = box.scrollHeight;
    });
    msg.appendChild(toggle);
    msg.appendChild(wrap);
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; send.disabled = true;
    addMessage(question, 'user');
    var loading = addMessage('답변을 찾는 중입니다…', 'bot loading');
    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, history: history.slice(-MAX_HISTORY), conversationId: conversationId })
      });
      if (!res.ok) throw new Error(String(res.status));
      var data = await res.json();
      loading.className = 'msg bot';
      loading.textContent = data.answer;
      addSources(loading, data.sources);
      history.push({ question: question, answer: data.answer });   // 같은 화면에서만 기억한다(새로고침하면 사라짐)
    } catch (e) {
      loading.className = 'msg bot error';
      loading.textContent = '답변을 가져오지 못했습니다. 모델 서버 연결 상태를 확인한 뒤 다시 시도해 주세요.';
    } finally {
      busy = false; send.disabled = false; input.focus();
      box.scrollTop = box.scrollHeight;
    }
  }

  function welcome() {
    var hello = addMessage('안녕하세요! 규정에 대해 궁금한 점을 물어보세요. 이어서 질문하셔도 앞의 대화를 기억합니다.', 'bot');
    var chips = el('div', 'chips');
    ['연차는 1년 일하면 며칠 받아요?', '병가는 최대 며칠이고 월급 나와요?', '징계에는 어떤 종류가 있어요?'].forEach(function (q) {
      var b = el('button', 'chip', q); b.type = 'button';
      b.addEventListener('click', function () { ask(q); });
      chips.appendChild(b);
    });
    hello.appendChild(chips);
  }
  function resetChat() {
    list.textContent = ''; history = []; conversationId = newId();
    welcome(); input.focus();
  }
  function setMode(mode) {
    panel.className = 'open mode-' + mode;
    document.querySelectorAll('#modes button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === mode); });
    box.scrollTop = box.scrollHeight;
  }

  document.getElementById('launcher').addEventListener('click', function () {
    var open = panel.classList.toggle('open');
    if (open) input.focus();
  });
  document.getElementById('close').addEventListener('click', function () { panel.classList.remove('open'); });
  document.getElementById('newchat').addEventListener('click', resetChat);
  document.getElementById('modes').addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.mode) setMode(e.target.dataset.mode);
  });
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value; input.value = ''; ask(q);
  });
  welcome();
})();
</script>
</body>
</html>
