<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사내 규정 RAG 챗봇 (테스트)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>사내 규정 RAG 챗봇</h1>
    <p class="subtitle">개발 중 · 내부 테스트용 화면</p>
  </header>

  <main class="layout">
    <!-- 관리자: 문서 업로드 영역 -->
    <section class="card">
      <h2>문서 업로드</h2>
      <p class="desc">사내 규정 PDF 파일을 업로드합니다.</p>

      <form id="upload-form" class="upload-form">
        <input type="file" id="file-input" accept="application/pdf" required />
        <button type="submit">업로드</button>
      </form>
      <p id="upload-status" class="status-text"></p>

      <h3>업로드된 문서</h3>
      <ul id="document-list" class="document-list">
        <li class="empty">아직 업로드된 문서가 없습니다.</li>
      </ul>
    </section>

    <!-- 사용자: 채팅 테스트 영역 -->
    <section class="card">
      <h2>챗봇 테스트</h2>
      <p class="desc">규정과 관련된 질문을 입력해 보세요.</p>

      <div id="chat-log" class="chat-log"></div>

      <form id="chat-form" class="chat-form">
        <input type="text" id="question-input" placeholder="예: 연차휴가는 며칠까지 이월되나요?" required />
        <button type="submit">전송</button>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
